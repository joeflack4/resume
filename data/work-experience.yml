  - job: CarePath (Project)
    title: Solo Dev
    url: tinyurl.com/carepath-post
    startDate: 2025/11
    endDate: 2025/11
    summary: >
      AI chatbot connected to a medical record system. Demonstrates a fault tolerant and scalable microservice setup for 
      deploying LLMs in web applications, with responses augmented by relevant user data using RAG. Built in 4 days 
      using spec-driven development.
    skills:
    - Python
    - React
    - Mongo
    - AWS
    - Kubernetes
    - ML Ops
    - Tailwind
    all-skills:
    - name: Python
      sub: [FastAPI, torch, transformers, accelerate, llama-cpp-python]
    - name: JavaScript / Frontend
      sub: [React, TypeScript, Vite]
    - name: Infra
      sub: [AWS, Terraform, Docker, Kubernetes, EKS, CloudFront, S3, IAM, VPC]
    - MongoDB
    - MongoDB Atlas
    - Hugging Face
    - GGUF
    statements:
    - Designed and built a zero-to-one AI chatbot connected to a mock medical record system in four days using spec-driven development.
    - Implemented a fault-tolerant microservice architecture using Python and FastAPI, separating data APIs from LLM-powered chat services.
    - Integrated retrieval-augmented generation (RAG) over MongoDB-backed synthetic EHR data.
    - Deployed open-source LLMs using both local inference (GGUF/CPU) and Hugging Face-hosted models with dynamic routing.
    - Built a modern React/TypeScript frontend with Tailwind for chatbot interaction, user data exploration, and history tracking.
    - Owned cloud architecture of Kubernetes-based infrastructure on AWS using Terraform, EKS, autoscaling, ConfigMaps, Secrets, and persistent volumes for model caching.
    - Implemented secure cloud architecture with IAM, private networking, CloudFront-hosted frontend, and managed MongoDB Atlas.
    # todo: add granular skills section?
    projects:
    - name: MVP
      statements:
      - Full ownership of solo-dev zero to one project, including idea conception, architecture design, and implementation.
      - Backend in Python using 2 FastAPI services - DB API and chat service.
      - Chat service using open source models (e.g. Qwen2.5-7B-Instruct), using RAG to interface with Mongo, and routing to use internally deployed model or Hugging Face cloud. Using torch, transformers, and accelerate, as well as llama-cpp-python for CPU-based GGUF models.
      - Data layer Mongo DB for synhetic patient data / mock EHR.
      - Modern frontend using React, TypeScript, Vite, and Tailwind. Pages for chatbot queries, and user data and history.
      - Infrastructure on AWS, using Terraform for IaC. Compute using EKS (Elastic Kubernetes Service) running services with ECR for Docker image storage. S3 for serving static React/Vite frontend with CloudFront CDN and OAI. S3 also with DynamoDB for Terraform state. Networking using Custom VPC, subnets, and gateways. Kubernetes using deployments, services load balancing, ConfigMaps, Secrets, and HPAs (Horizontal Pod Autoscalers). Security & Access with IAM role. EBS PVC for LLM model caching. MongoDB Atlas (managed cloud database) as the only non-AWS piece.

