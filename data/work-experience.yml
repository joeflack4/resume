    statements:
    - Served as a full stack and data engineer across multiple concurrent biomedical informatics projects, frequently in zero-to-one contexts.
    - Led and mentored small engineering teams, owning roadmaps, sprint planning, kanban boards, scheduling, and work allocation without formal supervisory authority.
    - Architected and maintained production-grade Python backends using FastAPI, Pydantic, SQLAlchemy, and custom data pipelines.
    - Designed complex PostgreSQL schemas and analytical layers with advanced indexing, materialized views, DAG-managed refreshes, and full-text search.
    - Built modern web frontends using React, TypeScript, Vite, MUI, and data visualization libraries for large-scale semantic datasets.
    - Developed graph-based data systems and visualizations using NetworkX, Neo4j, and D3-based tooling to support ontology exploration at scale.
    - Implemented semantic ingestion and harmonization pipelines using OWL, RDF, SPARQL, LinkML, and ontology reasoning tools.
    - Built NLP pipelines using sentence transformers and PyTorch for semantic similarity and curator-assisted matching.
    - Owned and operated CI/CD pipelines, infrastructure, and monitoring across Azure and cloud-hosted platforms.
    - Optimized large-scale analytics pipelines using PySpark (Apache Spark) and Databricks, achieving ~100x throughput improvements on de-identification workflows.
    - Contributed to and helped shape major open-source standards including LinkML and SSSOM, with focus on FHIR interoperability.
    - Owned long-term maintainability through extensive architecture documentation, onboarding guides, operational playbooks, and end-user documentation.
    # As needed: Extension: Redshift, Airflow, and OLTP/OLAP + star/snowflake schemas
#    - Managed workflow automation for several projects using Airflow, as well as custom Python and Make-based DAGs for ETL, ingestion, and analytical refresh processes.
