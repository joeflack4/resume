from: gfm
to: html
standalone: true
self-contained: true  # embeds css/js from external links
embed-resources: true  # embeds css/js from external links

metadata-files:
  - data/meta.yml
  - data/section-ordering/body.yml
  - data/work-experience.yml
  - data/projects.yml
  - data/education.yml   # or education.json

projects-importance-order-to-include-statements-blocks:
  # Genonaut: Web platform foundation
  1: Web platform foundation
  # MVP is for CarePath. that's the project name
  2: MVP
  3: TermHub
  4: TCCM & CCDH
  5: Just-a-Dash
  6: PMA API
  7: Datalab
  8: TIMS (Terminology Infrastructure Management Systems)
  9: JH K Anonymity
  10: CompLOINC
  11: Mondo Disease Ontology
  12: XFormTest
  13: Pretty PDF Printer
  14: Zulip Analysis

template: templates/in-development/html-stackoverflow/stackoverflow-theme.html

css:
  - templates/in-development/html-stackoverflow/theme.css
  - templates/in-development/html-stackoverflow/fontawesome-free-5.15.4-web/css/all.css
#  - templates/in-development/html-stackoverflow/fontawesome-v5.15.4-all.css

resource-path:
  - .
  - templates/in-development/html-stackoverflow
  - templates/html
  - assets/images

input-files:
#  - content/01-header.md  #duplicative; this is defined in the html with $ vars
  - content/02-summary.md
  - content/10-experience/2021-experience.md
  - content/10-experience/2025-.md
  - content/20-skills.md
#  - content/30-education.md
#  - content/40-projects.md
#  - content/50-awards.md
#  - content/60-languages.md
#  - content/70-interests.md
#  - content/80-references.md

filters:
  - templates/in-development/html-stackoverflow/filters/section-headings.lua

